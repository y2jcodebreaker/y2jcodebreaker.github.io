name: Kedar Joshi
role: MS Computer Science, University of Southern California
positioning: >-
  I study whether language models reason or pattern-match, and whether you can
  catch the difference in the geometry of their activations. I work by
  controlled perturbation — obfuscating the logic of a problem, quantizing a
  layer, subtracting a direction — and reading what changes, so that a claim
  about "what the model learned" is one I can intervene on rather than just
  assert.
